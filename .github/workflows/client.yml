name: Client

# The desktop client in client/ (GitHub#135): its own tests, its own macOS
# packages, its own Releases (tag client/vX.Y.Z). Nothing here touches the
# daemon's tests; the daemon's weekly release calls this workflow for the
# client's release (GitHub#576) and never waits for it.
#
# What runs when:
#   every PR push                 quick tests: typecheck + cargo, vitest in two halves, in parallel (a few minutes)
#   push to main                  quick tests + the Mac arm64 build (dmg + its checks) + the Windows
#                                 x64 build (installer + its checks, GitHub#577), then the development
#                                 build is published as a pre-release (GitHub#215)
#   client/v* tag                 quick + full tests (Playwright, the real app on Linux) + the Macs,
#                                 arm64 and x64, + Windows x64; any failure, no Release
#   called by release.yml         the same as a client/v* tag, for the tag and commit the weekly
#                                 release planned (GitHub#576: a tag pushed with the workflow's own
#                                 token starts no run, so the weekly release calls this workflow)
#   weekly / manual run           quick + full tests + the Mac arm64 build + the Windows build (packaging
#                                 or end-to-end breakage shows up within a week)
# Negative controls run automatically only in the weekly release gate
# (.github/workflows/release.yml, job gate-client), on the commit that release tags.
on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
      - '.github/actions/client-setup/**'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
      - '.github/actions/client-setup/**'
    tags:
      - 'client/v*'
  schedule:
    - cron: '40 16 * * 0'
  # No negative controls here, manual runs included: they run only in negative-controls.yml
  # (GitHub#416).
  workflow_dispatch:
  # GitHub#576: the weekly Release workflow's client release. The tag need not exist yet: the release
  # job creates it on `sha` once everything passed. Versions: scripts/release-version.mjs.
  workflow_call:
    inputs:
      tag:
        description: 'client/vX.Y.Z to release'
        type: string
        required: true
      sha:
        description: 'the commit to build, test and tag'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # the weekly run has its own group, so it never cancels (or is cancelled by) a push to main; a
  # release called by release.yml has one per tag (its github.ref is the caller's, often main)
  group: client-${{ inputs.tag && format('release-{0}', inputs.tag) || github.event.pull_request.number || github.ref }}${{ !inputs.tag && github.event_name == 'schedule' && '-weekly' || '' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  # What this run builds, decided once (GitHub#576) and read by every later job:
  #   tag      client/vX.Y.Z for a release build (a pushed client/v* tag, or the tag release.yml
  #            passed in), empty for a development build
  #   version  X.Y.Z of that tag, checked by scripts/release-version.mjs (not below package.json,
  #            above every other client/vX.Y.Z tag); the build writes it into the three version files
  #   sha      the commit every job checks out: the one release.yml planned, else this run's own
  #   sign     true when the update packages are signed with the maintainer's key (a release, or the
  #            development build of a push to main); every other run uses a throw-away key
  mode:
    name: client build mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.mode.outputs.tag }}
      version: ${{ steps.mode.outputs.version }}
      sha: ${{ steps.mode.outputs.sha }}
      sign: ${{ steps.mode.outputs.sign }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Release or development build
        id: mode
        env:
          CALL_TAG: ${{ inputs.tag }}
          CALL_SHA: ${{ inputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          tag=""
          sha="$GITHUB_SHA"
          if [ -n "$CALL_TAG" ]; then
            [ -n "$CALL_SHA" ] || { echo "::error::called for $CALL_TAG without a commit"; exit 1; }
            tag="$CALL_TAG"
            sha="$CALL_SHA"
          elif [[ "$GITHUB_REF" == refs/tags/client/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version=""
          if [ -n "$tag" ]; then
            version="$(node scripts/release-version.mjs check "$tag" --at "$sha")"
            echo "release build $tag ($version) of $sha"
          else
            echo "development build of $sha"
          fi
          sign=false
          if [ -n "$tag" ] || { [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; }; then sign=true; fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "sha=$sha"
            echo "sign=$sign"
          } >> "$GITHUB_OUTPUT"

  # The quick tests run as three parallel jobs (GitHub#495: one after another they took ~10 minutes):
  # type check + the back end's cargo tests, and vitest in two halves. `test` below is the one check
  # the later jobs wait on; it is green only when all three are.
  test-rust:
    name: client quick tests — type check + back end (Linux)
    needs: mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/client-setup
        with:
          ui: 'false'
      - name: Type check
        run: npm run typecheck
      - name: Back end unit tests (cargo)
        run: npm run test:rust

  test-vitest:
    name: client quick tests — vitest ${{ matrix.shard }}/2 (Linux)
    needs: mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
          # the upgrade tests take earlier commits' files (git show / archive)
          fetch-depth: 0
      - uses: ./.github/actions/client-setup
        with:
          ui: 'false'
          webkit: 'false'
      # `npm test` is `vitest run && bash test/mutation/run.sh`: the two halves of the first, and the
      # second (it only counts the negative controls it skips) once, in half 1.
      - name: Unit tests (vitest ${{ matrix.shard }}/2, real back end as a child process)
        run: npx vitest run --shard=${{ matrix.shard }}/2
      - name: Negative controls skipped by default (count only)
        if: matrix.shard == 1
        run: bash test/mutation/run.sh

  test:
    name: client quick tests (Linux)
    needs: [test-rust, test-vitest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both quick-test jobs passed
        working-directory: .
        env:
          RUST: ${{ needs.test-rust.result }}
          VITEST: ${{ needs.test-vitest.result }}
        run: |
          echo "type check + back end: $RUST; vitest: $VITEST"
          [ "$RUST" = success ] && [ "$VITEST" = success ]

  # Playwright + the real app on Linux. Each builds the whole app, so only on a release build,
  # the weekly run and a manual run — not on pull requests, not on pushes to main.
  e2e:
    name: client full tests (Linux)
    needs: mode
    if: needs.mode.outputs.tag != '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/client-setup
      - name: UI tests (Playwright on WebKit, real window + real back end)
        run: npm run test:e2e
      - name: The app itself on Linux (Tauri window + IPC + back end) starts
        run: |
          node scripts/build.mjs
          (cd src-tauri && cargo build -p cavil-loop-client)
          out="$(xvfb-run -a src-tauri/target/debug/cavil-loop-client --smoke-test 2>&1 || true)"
          echo "$out" | tail -5
          grep -q 'CAVIL_SMOKE_OK' <<<"$out"
      - name: The real app over WebDriver (sign in, sync, a change, the shell's link and navigation handlers)
        run: xvfb-run -a npm run test:tauri
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screens
          path: client/test-results/
          if-no-files-found: ignore

  package:
    name: dmg (${{ matrix.arch }})
    # Not on pull requests (GitHub#195). arm64 alone on a push to main, the weekly run and a manual
    # run; arm64 and x64 on a release build.
    needs: mode
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      # x64 (Intel) only on a release build, where the Release ships both dmgs; a push to main, the
      # weekly and the manual runs build and check arm64 alone.
      matrix:
        include: ${{ fromJSON(needs.mode.outputs.tag != '' && '[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]' || '[{"arch":"arm64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
          # the development build's version counts the commits (scripts/dev-version.mjs)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: cargo-mac-${{ matrix.arch }}-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: cargo-mac-${{ matrix.arch }}-
      # dmgbuild lays out the dmg window without scripting Finder (scripts/make-dmg.mjs)
      - name: dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
      - run: npm ci
      # The version is stamped into package.json / tauri.conf.json / Cargo.toml here (never
      # committed). A release build takes its tag's X.Y.Z (GitHub#576); every other build is a
      # development build, X.Y.(Z+1)-dev.N (GitHub#215). Only a push to main publishes the latter
      # (job dev-release); the weekly and manual runs build and check the same thing.
      - name: Version
        env:
          TAG: ${{ needs.mode.outputs.tag }}
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            [ -n "$VERSION" ] || { echo "::error::release build $TAG without a version"; exit 1; }
            node scripts/release-version.mjs write "$VERSION"
          else
            node scripts/dev-version.mjs --write
          fi
      # GitHub#184: the update package (.app.tar.gz + .sig) is built next to the dmg. The public key
      # has one home, plugins.updater.pubkey in src-tauri/tauri.conf.json (the app reads it at run
      # time, the bundler when it signs, the release job when it verifies). A release build and a push to
      # main (its development build is published, GitHub#215 — the maintainer chose to sign it with the
      # same key) sign with the maintainer's key (secret) against that public key, and refuse when
      # either is missing; every other run (weekly, manual) uses a throw-away key pair, passed to the
      # bundler as a matching pair, so it builds and measures the same files (those packages are
      # never published).
      - name: Build the app (Tauri), its update package, and the dmg
        env:
          SIGN: ${{ needs.mode.outputs.sign }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.mode.outputs.sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.mode.outputs.sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ "$SIGN" = true ]; then
            [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::a release build and a push to main need the TAURI_SIGNING_PRIVATE_KEY secret (the update key; see client/README.md 发版)"; exit 1; }
            pub="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
            [ -n "$pub" ] || { echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is empty: the app could not check any update (see client/README.md 发版)"; exit 1; }
          else
            npx tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway-update.key" >/dev/null
            export TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/throwaway-update.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
            pub="$(cat "$RUNNER_TEMP/throwaway-update.key.pub")"
          fi
          conf="$(node -e 'console.log(JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.argv[1] } } }))' "$pub")"
          npx tauri build --bundles app --config "$conf"
          # the signature the bundler wrote verifies with the public key it was given (on a tag: the app's own)
          printf '%s' "$conf" > "$RUNNER_TEMP/update-conf.json"
          node scripts/update-manifest.mjs --verify "src-tauri/target/release/bundle/macos/Cavil Loop.app.tar.gz" "src-tauri/target/release/bundle/macos/Cavil Loop.app.tar.gz.sig" --conf "$RUNNER_TEMP/update-conf.json"
          node scripts/make-dmg.mjs --arch ${{ matrix.arch }}
          v="$(node -p "require('./package.json').version")"
          for ext in tar.gz tar.gz.sig; do
            cp "src-tauri/target/release/bundle/macos/Cavil Loop.app.$ext" "release/Cavil-Loop-$v-${{ matrix.arch }}.app.$ext"
          done
          ls -la release
      # GitHub#151: ≤ 10 MB is the target, > 20 MB fails (1 MB = 1,000,000 bytes)
      - name: Download size
        run: |
          node scripts/size-gate.mjs release/Cavil-Loop-*-${{ matrix.arch }}.dmg --expect ${{ matrix.arch }}
          node scripts/size-gate.mjs release/Cavil-Loop-*-${{ matrix.arch }}.app.tar.gz --expect ${{ matrix.arch }}
      - name: Smoke test + first-open steps + dmg window
        run: bash scripts/mac-open-check.sh release/Cavil-Loop-*-${{ matrix.arch }}.dmg "$RUNNER_TEMP/dmg-window-${{ matrix.arch }}.png"
      # GitHub#184: the installed old version updates itself to a new one, for real (Tauri's updater
      # plugin, /Applications, a loopback stand-in for GitHub); a tampered package is refused.
      - name: A real update of the installed app
        run: |
          npx tauri build --debug --bundles app --features update-test
          bash scripts/mac-update-check.sh "src-tauri/target/debug/bundle/macos/Cavil Loop.app"
      # The dmg itself, not zipped (archive: false; the artifact is named after the file).
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: client/release/Cavil-Loop-*-${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error
      # and the update package and its signature (GitHub#184), the same way
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: client/release/Cavil-Loop-*-${{ matrix.arch }}.app.tar.gz
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: client/release/Cavil-Loop-*-${{ matrix.arch }}.app.tar.gz.sig
          archive: false
          if-no-files-found: error
      - name: Upload the dmg window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-dmg-window-${{ matrix.arch }}
          path: ${{ runner.temp }}/dmg-window-${{ matrix.arch }}.png
          if-no-files-found: ignore

  # GitHub#577: the Windows x64 app — wherever the Macs are built (never on a pull request). Its own back
  # end tests that need Windows (the real Credential Manager), the installer (NSIS .exe, which is also
  # the update package Tauri's updater runs, signed like the Macs' packages), a silent install, the
  # installed app's start-up check and one real notification, the size gate. Not signed with a code
  # signing certificate (the maintainer's choice on #574): Windows warns on first install.
  package-windows:
    name: Windows installer (x64)
    needs: mode
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
          # the development build's version counts the commits (scripts/dev-version.mjs)
          fetch-depth: 0
          # client/ only (plus the files at the top): some of the daemon's file names cannot exist on
          # Windows (systemd's escaped unit names, e.g. app-cavil\x2dloop\x2dpoll.slice)
          sparse-checkout: client
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: cargo-windows-x64-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-x64-
      - run: npm ci
      # the parts of the back end only Windows can run: the real Credential Manager (store, read back,
      # clear, "not there" after clearing), and the rest of the Windows-only rules
      - name: Back end on Windows (Credential Manager, taskbar number, notifications, Tailscale path)
        run: |
          cd src-tauri
          cargo test -p cavil-core --lib -- wincred:: badge:: toast:: remote::tests::tailscale
      # the same version rule as the Macs (one step text, see the dmg job)
      - name: Version
        env:
          TAG: ${{ needs.mode.outputs.tag }}
          VERSION: ${{ needs.mode.outputs.version }}
        run: |
          if [ -n "$TAG" ]; then
            [ -n "$VERSION" ] || { echo "::error::release build $TAG without a version"; exit 1; }
            node scripts/release-version.mjs write "$VERSION"
          else
            node scripts/dev-version.mjs --write
          fi
      # signing the update package: exactly as on the Macs (the maintainer's key on a release build and a
      # push to main, a throw-away pair otherwise)
      - name: Build the app and its installer (= its update package)
        env:
          SIGN: ${{ needs.mode.outputs.sign }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.mode.outputs.sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.mode.outputs.sign == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ "$SIGN" = true ]; then
            [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::a release build and a push to main need the TAURI_SIGNING_PRIVATE_KEY secret (the update key; see client/README.md 发版)"; exit 1; }
            pub="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
            [ -n "$pub" ] || { echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is empty: the app could not check any update (see client/README.md 发版)"; exit 1; }
          else
            npx tauri signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway-update.key" >/dev/null
            TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/throwaway-update.key")"
            export TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
            pub="$(cat "$RUNNER_TEMP/throwaway-update.key.pub")"
          fi
          conf="$(node -e 'console.log(JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.argv[1] } } }))' "$pub")"
          # the installer's name carries the version: an earlier build's, restored with the cache, would be a second one
          rm -rf src-tauri/target/release/bundle/nsis
          npx tauri build --bundles nsis --config "$conf""
          v="$(node -p "require('./package.json').version")"
          exe="$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe)"
          printf '%s' "$conf" > "$RUNNER_TEMP/update-conf.json"
          node scripts/update-manifest.mjs --verify "$exe" "$exe.sig" --conf "$RUNNER_TEMP/update-conf.json"
          mkdir -p release
          cp "$exe" "release/Cavil-Loop-$v-windows-x64.exe"
          cp "$exe.sig" "release/Cavil-Loop-$v-windows-x64.exe.sig"
          ls -la release
      # GitHub#151 / #577: the same gate as the dmgs (≤ 10 MB target, > 20 MB fails)
      - name: Download size
        run: node scripts/size-gate.mjs release/Cavil-Loop-*-windows-x64.exe --expect windows-x64
      # The installer as a person runs it (silently here), then the installed app: it starts, its window
      # mounts and reaches the back end (--smoke-test), and one real notification goes to the system
      # (--notify-check: reported, never failing the job — a runner's notification settings are not ours).
      - name: Install, start, notify
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'Cavil-Loop-*-windows-x64.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA 'Cavil Loop\Cavil Loop.exe'
          if (-not (Test-Path $app)) { Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Cavil Loop') -ErrorAction SilentlyContinue | Select-Object FullName; Write-Error "not installed at $app"; exit 1 }
          $lnk = Get-ChildItem -Recurse ([Environment]::GetFolderPath('Programs')) -Filter 'Cavil Loop.lnk' -ErrorAction SilentlyContinue
          if (-not $lnk) { Write-Error 'no Start menu shortcut (notifications need it)'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $s = Start-Process -FilePath $app -ArgumentList '--smoke-test', "--smoke-out=$out" -Wait -PassThru
          $line = if (Test-Path $out) { Get-Content $out -Raw } else { '' }
          Write-Output "smoke: exit $($s.ExitCode): $line"
          if ($s.ExitCode -ne 0 -or $line -notmatch 'CAVIL_SMOKE_OK') { exit 1 }
          $n = Join-Path $env:RUNNER_TEMP 'notify.txt'
          $c = Start-Process -FilePath $app -ArgumentList '--notify-check', "--smoke-out=$n" -Wait -PassThru
          $said = if (Test-Path $n) { Get-Content $n -Raw } else { '(nothing written)' }
          Write-Output "notification check: exit $($c.ExitCode): $said"
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: client/release/Cavil-Loop-*-windows-x64.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: client/release/Cavil-Loop-*-windows-x64.exe.sig
          archive: false
          if-no-files-found: error

  size:
    name: download size (every dmg and installer built)
    needs: [mode, package, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Cavil-Loop-*
          path: client/dist-release
          merge-multiple: true
      - name: Each dmg, each update package and the Windows installer ≤ 20 MB (target ≤ 10 MB)
        env:
          ARCHES: ${{ needs.mode.outputs.tag != '' && 'arm64,x64' || 'arm64' }}
        run: |
          node scripts/size-gate.mjs dist-release/*.dmg --expect "$ARCHES"
          node scripts/size-gate.mjs dist-release/*.app.tar.gz --expect "$ARCHES"
          node scripts/size-gate.mjs dist-release/*-windows-x64.exe --expect windows-x64

  # A release build (a pushed client/v* tag, or the weekly release's call, GitHub#576): only after the
  # quick and full tests, both Macs, Windows (GitHub#577) and the size gate passed. The version is the tag's, stamped at
  # build time; the tag goes on exactly the tested commit (`sha`), created here when it does not exist
  # yet (pushed with this job's token, so it starts no other run), and checked again right before the
  # page is created.
  release:
    name: publish client release
    needs: [mode, test, e2e, package, package-windows, size]
    if: needs.mode.outputs.tag != ''
    # One client release publishes at a time, whatever its version or how it started (a pushed tag,
    # the weekly call): the builds of two versions may overlap for an hour, but their writes never do,
    # and each re-checks the version order (scripts/release-version.mjs check) right before it writes —
    # an older version waiting here stops once a newer one is out. Never cancels the running one.
    concurrency:
      group: client-release-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Cavil-Loop-*
          path: client/dist-release
          merge-multiple: true
      - name: The build is the tag's version, both Macs and Windows
        env:
          V: ${{ needs.mode.outputs.version }}
        run: |
          ls -la dist-release
          [ -n "$V" ] || { echo "::error::no version for this release build"; exit 1; }
          for arch in arm64 x64; do
            for f in "Cavil-Loop-$V-$arch.dmg" "Cavil-Loop-$V-$arch.app.tar.gz" "Cavil-Loop-$V-$arch.app.tar.gz.sig"; do
              [ -f "dist-release/$f" ] || { echo "::error::dist-release/$f is missing: the build is not $V for both Macs"; exit 1; }
            done
          done
          for f in "Cavil-Loop-$V-windows-x64.exe" "Cavil-Loop-$V-windows-x64.exe.sig"; do
            [ -f "dist-release/$f" ] || { echo "::error::dist-release/$f is missing: the build is not $V for Windows"; exit 1; }
          done
      # GitHub#184: what installed apps read to update themselves. Refuses unless every update package
      # (both Macs, Windows) is there and their signatures verify with the app's public key (tauri.conf.json) and are bound
      # to this version.
      - name: Update manifest (latest.json)
        env:
          V: ${{ needs.mode.outputs.version }}
        run: node scripts/update-manifest.mjs --version "$V" --dir dist-release --conf src-tauri/tauri.conf.json --notes RELEASE_NOTES.md --out dist-release/latest.json
      # The remote's tag: absent → create it on the tested commit; on that commit → keep; anywhere
      # else, or unreadable → stop, no page.
      - name: Tag the tested commit
        env:
          TAG: ${{ needs.mode.outputs.tag }}
          SHA: ${{ needs.mode.outputs.sha }}
        run: |
          set -o pipefail
          # still the newest release: the remote's every client tag, read now (a failed read stops)
          node scripts/release-version.mjs check "$TAG" --at "$SHA" >/dev/null
          refs="$(git ls-remote --tags origin "refs/tags/$TAG")"
          now="$(awk -v t="refs/tags/$TAG" '$2 == t { p = $1 } $2 == t "^{}" { q = $1 } END { print (q != "" ? q : p) }' <<<"$refs")"
          if [ -z "$now" ]; then
            # straight onto the remote: no local tag, so none left over from an earlier attempt is pushed
            git push origin "$SHA:refs/tags/$TAG"
            echo "pushed $TAG → $SHA"
          elif [ "$now" = "$SHA" ]; then
            echo "$TAG already points at $SHA"
          else
            echo "::error::$TAG is on $now, not on the tested $SHA — no Release"
            exit 1
          fi
      # Not marked latest: the daemon's weekly release stays "Latest". --verify-tag: gh never creates
      # a missing tag on the default branch's tip, a commit nothing here tested.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.mode.outputs.tag }}
          SHA: ${{ needs.mode.outputs.sha }}
        run: |
          set -o pipefail
          refs="$(git ls-remote --tags origin "refs/tags/$TAG")"
          now="$(awk -v t="refs/tags/$TAG" '$2 == t { p = $1 } $2 == t "^{}" { q = $1 } END { print (q != "" ? q : p) }' <<<"$refs")"
          if [ "$now" != "$SHA" ]; then
            echo "::error::the remote's $TAG is at '${now:-nothing}', not the tested $SHA — no Release"
            exit 1
          fi
          # and once more right before the page: no newer client tag appeared meanwhile
          node scripts/release-version.mjs check "$TAG" --at "$SHA" >/dev/null
          gh release create "$TAG" dist-release/*.dmg dist-release/*.app.tar.gz dist-release/*.app.tar.gz.sig dist-release/*-windows-x64.exe dist-release/*-windows-x64.exe.sig dist-release/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Cavil Loop 客户端 ${TAG#client/}" \
            --notes-file RELEASE_NOTES.md \
            --latest=false

  # GitHub#215: the development build of a push to main, for installed apps on the development
  # channel: a pre-release tagged client/vX.Y.(Z+1)-dev.N (never Latest), only after the quick tests,
  # the Mac build and its real-update check, the Windows build (GitHub#577), and the size gate passed. scripts/dev-release.mjs
  # publishes it complete or not at all, never on top of a newer one, and keeps the latest 10.
  dev-release:
    name: publish development build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.mode.outputs.tag == ''
    needs: [mode, test, package, package-windows, size]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.mode.outputs.sha }}
          fetch-depth: 0
      # the same version the Mac build stamped: same commit, same count, same tags
      - name: Version
        id: v
        run: |
          v="$(node scripts/dev-version.mjs)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "development build $v"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Cavil-Loop-*
          path: client/dist-release
          merge-multiple: true
      - name: The Mac and Windows builds are that version
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          ls -la dist-release
          for f in "Cavil-Loop-$V-arm64.dmg" "Cavil-Loop-$V-arm64.app.tar.gz" "Cavil-Loop-$V-arm64.app.tar.gz.sig" "Cavil-Loop-$V-windows-x64.exe" "Cavil-Loop-$V-windows-x64.exe.sig"; do
            [ -f "dist-release/$f" ] || { echo "::error::dist-release/$f is missing"; exit 1; }
          done
      - name: Release notes
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "开发版 $V，构建自 main 的 $GITHUB_SHA：$(git log -1 --format=%s "$GITHUB_SHA")"
            echo
            echo "只有在客户端设置里把「更新渠道」选成「开发版」的 App 会自动装它；可能不稳定。正式版见不带 -dev 的 client/v… 发版。"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      # refuses unless the Apple silicon and the Windows packages are there and verify with the app's public key
      - name: Update manifest (latest.json, development channel)
        env:
          V: ${{ steps.v.outputs.version }}
        run: node scripts/update-manifest.mjs --channel dev --version "$V" --dir dist-release --conf src-tauri/tauri.conf.json --notes "$RUNNER_TEMP/notes.md" --out dist-release/latest.json
      - name: Publish (pre-release), keep the latest 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: node scripts/dev-release.mjs --version "$V" --sha "$GITHUB_SHA" --dir dist-release --notes-file "$RUNNER_TEMP/notes.md" --keep 10 --repo "$GITHUB_REPOSITORY"
