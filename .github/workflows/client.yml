name: Client

# The desktop client in client/ (GitHub#135): its own tests, its own macOS
# packages, its own Releases (tag client/vX.Y.Z). Nothing here touches the
# daemon's tests or its weekly release.
on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
    tags:
      - 'client/v*'
  workflow_dispatch:
    inputs:
      mutation:
        description: 'Also run the negative controls (MUTATION=1)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  test:
    name: client tests (Linux)
    runs-on: ubuntu-latest
    # negative controls rebuild the back end / the app per entry
    timeout-minutes: ${{ inputs.mutation && 240 || 60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the negative-control runner and the upgrade tests take earlier commits' files (git show / archive)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      # The back end is Rust (src-tauri/crates/core); the suites drive it as a child process.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: cargo-linux-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: cargo-linux-
      # system WebKit for the app's own Linux build (smoke test below)
      - name: System libraries for the Tauri window
        # a stuck package mirror fails this step quickly instead of eating the job's time
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev xvfb webkit2gtk-driver
      # WebDriver for the real Tauri window (test/tauri); kept in the cache between runs
      - uses: actions/cache@v4
        with:
          path: ~/.tauri-driver
          key: tauri-driver-2-${{ runner.os }}
      - name: tauri-driver
        run: |
          [ -x "$HOME/.tauri-driver/bin/tauri-driver" ] || cargo install tauri-driver --locked --root "$HOME/.tauri-driver"
          echo "$HOME/.tauri-driver/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Back end unit tests (cargo)
        run: npm run test:rust
      - name: Unit tests (vitest, real back end as a child process)
        run: npm test
      - name: Negative controls
        if: ${{ inputs.mutation }}
        run: MUTATION=1 npm run test:mutation
      - name: UI tests (Playwright on WebKit, real window + real back end)
        run: |
          npx playwright install --with-deps webkit
          npm run test:e2e
      - name: The app itself on Linux (Tauri window + IPC + back end) starts
        run: |
          node scripts/build.mjs
          (cd src-tauri && cargo build -p cavil-loop-client)
          out="$(xvfb-run -a src-tauri/target/debug/cavil-loop-client --smoke-test 2>&1 || true)"
          echo "$out" | tail -5
          grep -q 'CAVIL_SMOKE_OK' <<<"$out"
      - name: The real app over WebDriver (sign in, sync, a change, the shell's link and navigation handlers)
        run: xvfb-run -a npm run test:tauri
      - name: Negative controls for the app shell (each rebuilds the real app)
        if: ${{ inputs.mutation }}
        run: xvfb-run -a env MUTATION=1 node test/tauri/mutations.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screens
          path: client/test-results/
          if-no-files-found: ignore

  package:
    name: dmg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: cargo-mac-${{ matrix.arch }}-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: cargo-mac-${{ matrix.arch }}-
      # dmgbuild lays out the dmg window without scripting Finder (scripts/make-dmg.mjs)
      - name: dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Build the app (Tauri) and the dmg
        run: |
          npx tauri build --bundles app
          node scripts/make-dmg.mjs --arch ${{ matrix.arch }}
          ls -la release
      # GitHub#151: ≤ 10 MB is the target, > 20 MB fails (1 MB = 1,000,000 bytes)
      - name: Download size
        run: node scripts/size-gate.mjs release/Cavil-Loop-*-${{ matrix.arch }}.dmg --expect ${{ matrix.arch }}
      - name: Smoke test + first-open steps + dmg window
        run: bash scripts/mac-open-check.sh release/Cavil-Loop-*-${{ matrix.arch }}.dmg "$RUNNER_TEMP/dmg-window-${{ matrix.arch }}.png"
      # The dmg itself, not zipped (archive: false; the artifact is named after the file).
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: client/release/Cavil-Loop-*-${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error
      - name: Upload the dmg window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-dmg-window-${{ matrix.arch }}
          path: ${{ runner.temp }}/dmg-window-${{ matrix.arch }}.png
          if-no-files-found: ignore

  size:
    name: download size (both dmgs)
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Cavil-Loop-*.dmg
          path: client/dist-release
          merge-multiple: true
      - name: Each dmg ≤ 20 MB (target ≤ 10 MB)
        run: node scripts/size-gate.mjs dist-release/*.dmg --expect arm64,x64

  release:
    name: publish client release
    if: startsWith(github.ref, 'refs/tags/client/v')
    needs: [test, package, size]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          want="client/v$(node -p "require('./package.json').version")"
          [ "$tag" = "$want" ] || { echo "::error::tag $tag does not match package.json ($want)"; exit 1; }
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: Cavil-Loop-*.dmg
          path: client/dist-release
          merge-multiple: true
      - name: Both dmgs are there
        run: |
          ls -la dist-release
          [ "$(ls dist-release/*-arm64.dmg dist-release/*-x64.dmg | wc -l)" -eq 2 ]
      # Not marked latest: the daemon's weekly release stays "Latest".
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist-release/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cavil Loop 客户端 ${tag#client/}" \
            --notes-file RELEASE_NOTES.md \
            --latest=false
