name: Release

on:
  push:
    tags:
      - 'release/v*'
  # One release per iteration. Iterations run Monday–Sunday (Beijing time). Fire
  # every day at 00:10 Beijing time (= 16:10 UTC): Monday's run releases the week
  # that just ended; the other six find it released and stop within seconds — or,
  # when Monday's gate was red, release that same week once the fix is on main
  # (GitHub#309). The plan step decides which, once, for the whole run.
  schedule:
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      gate_only:
        description: 'Only run the release gate (every negative control); cut no tag, create no Release'
        type: boolean
        default: false

permissions:
  contents: write

# A scheduled run and a manual one must not both compute "next tag".
concurrency:
  group: release
  cancel-in-progress: false

# Every negative control in the repo runs here and nowhere else automatically
# (GitHub#195): the shell tests' and both client sets, before a tag is cut,
# against the one commit the tag will point at. Any failure means no tag and no
# Release this run.
#   plan  → which commit, and is there anything to release at all
#   gate / gate-autopilot → MUTATION=1 on every tests/*.test.sh (autopilot's ~100
#           broken copies are split over their own jobs, the rest over 4 shards)
#   gate-client → every client negative control: test/mutation and the real app's set
#   gate-summary → green only when every shard and every gate job passed
#   release → checks the gate again, then tags exactly the planned commit, notes, Release page
# The two "did the gate pass" steps read the `needs` context, which only holds the
# jobs a job declares: dropping a gate job from `needs` fails them, it never skips the check.
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      work: ${{ steps.decide.outputs.work }}
      tag: ${{ steps.decide.outputs.tag }}
      action: ${{ steps.decide.outputs.action }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # What this run does, decided once (GitHub#309) and handed to every later job:
      # the commit the gate tests, the tag the release step uses, and the action —
      #   push   a tag pushed by a person: gate its commit, create its page
      #   verify a manual gate-only run: gate main's tip, release nothing
      #   new / page / none  scheduled run or manual release: scripts/release.sh --plan
      #          (the week that just ended; a tag without its page is always finished first)
      # Nothing later reads the clock or picks a commit again. A failed lookup fails the
      # run rather than guessing either way.
      - name: Decide what this run does
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          GATE_ONLY: ${{ inputs.gate_only && 'true' || '' }}
        run: |
          if [ "$EVENT" = push ]; then
            sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
            tag="${GITHUB_REF#refs/tags/}"
            action=push
          elif [ -n "$GATE_ONLY" ]; then
            sha="$(git rev-parse HEAD)"
            tag=""
            action=verify
            echo "只跑门禁：验证 $sha，不打标签、不发版"
          else
            trigger=manual
            [ "$EVENT" = schedule ] && trigger=schedule
            released_file="$(mktemp)"
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$released_file"
            plan="$(bash scripts/release.sh --plan --trigger "$trigger" --released "$released_file")"
            action="$(sed -n 's/^action=//p' <<<"$plan")"
            sha="$(sed -n 's/^sha=//p' <<<"$plan")"
            tag="$(sed -n 's/^tag=//p' <<<"$plan")"
            sed -n 's/^reason=//p' <<<"$plan"
            case "$action" in
              new|page) [ -n "$sha" ] && [ -n "$tag" ] || { echo "::error::plan without a commit or tag: $plan"; exit 1; } ;;
              none) ;;
              *) echo "::error::unknown plan: $plan"; exit 1 ;;
            esac
          fi
          work=true
          [ "$action" = none ] && work=false
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "work=$work" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

  gate:
    name: gate ${{ matrix.shard }}/4
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      MUTATION: '1'
      # autopilot's negative controls run in gate-autopilot; here the file still
      # runs its scenarios, with no broken copy selected (no name matches).
      AUTOPILOT_MUT_ONLY: none-see-gate-autopilot
      RUN_TEST_TIMEOUT: '5400'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Check origin/main is present
        run: |
          git rev-parse --verify -q origin/main >/dev/null || git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base HEAD origin/main
      - name: Install tmux
        run: |
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V
      - name: Negative controls, shard ${{ matrix.shard }}/4
        run: bash tests/run.sh --ci --shard ${{ matrix.shard }}/4 --out "$RUNNER_TEMP/results"
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 14

  gate-autopilot:
    name: gate autopilot ${{ matrix.part }}/6
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    env:
      MUTATION: '1'
      AUTOPILOT_MUT_SHARD: ${{ matrix.part }}/6
      RUN_TEST_TIMEOUT: '12600'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Check origin/main is present
        run: |
          git rev-parse --verify -q origin/main >/dev/null || git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base HEAD origin/main
      - name: Install tmux
        run: |
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V
      - name: autopilot negative controls, part ${{ matrix.part }}/6
        run: bash tests/run.sh autopilot --out "$RUNNER_TEMP/results"
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-autopilot-${{ matrix.part }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 14

  gate-client:
    name: gate client
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # the negative-control runner takes earlier commits' files (git show / archive)
          fetch-depth: 0
      # The same environment as client.yml's tests, Playwright's WebKit included: the
      # runner starts a UI baseline before the first broken copy.
      - uses: ./.github/actions/client-setup
      # Both runners' output is kept (tee) so a failure can name the entries that did not go red.
      - name: Negative controls (vitest / back end / UI)
        run: |
          set -o pipefail
          MUTATION=1 npm run test:mutation 2>&1 | tee "$RUNNER_TEMP/client-mutation.log"
      # It builds the window (dist/) and the app's icons itself before its first entry: this
      # checkout is clean, and neither is in git (tests/client-tauri-mutation-prep.test.sh).
      - name: Negative controls for the app shell (each rebuilds the real app)
        run: |
          set -o pipefail
          xvfb-run -a env MUTATION=1 bash test/tauri/mutations.sh 2>&1 | tee "$RUNNER_TEMP/client-tauri-mutation.log"
      # The "did not go red" lines, for the failure report (GitHub#285); a small file, not the logs.
      - name: Keep the list of entries that did not go red
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/client-failures"
          cat "$RUNNER_TEMP"/client-*mutation.log 2>/dev/null | grep '^❌' > "$RUNNER_TEMP/client-failures/not-red.txt" || true
          cat "$RUNNER_TEMP/client-failures/not-red.txt"
      - name: Upload the list
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-client-failures
          path: ${{ runner.temp }}/client-failures/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-client-screens
          path: client/test-results/
          if-no-files-found: ignore

  # Green only when every expected test file passed exactly once across the four
  # shards and every gate job passed: a shard that never ran fails it too.
  gate-summary:
    name: release gate
    needs: [plan, gate, gate-autopilot, gate-client]
    if: ${{ !cancelled() && needs.plan.outputs.work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gate-results-shard-*
          path: results
      # The autopilot jobs' results, only for the negative-control totals below: each of the six
      # jobs runs every autopilot part, so they cannot go through the exactly-once check.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gate-autopilot-*
          path: results-autopilot
      # Both summaries are also saved for the failure report (GitHub#285: its list of failed units).
      - name: Every shell shard passed exactly once
        run: |
          set -o pipefail
          mkdir -p results "$RUNNER_TEMP/gate-summary"
          bash tests/run.sh --ci --verify results | tee "$RUNNER_TEMP/gate-summary/verify.md"
      # Reports only (exit 0): how many negative controls ran across the shell shards and the six
      # autopilot jobs, how many did not go red, and which units failed (GitHub#212). The verdict is
      # the step above and the next one. "Skipped" adds up overlapping slices (each autopilot job
      # skips what the other five run); "ran" is the number to read.
      - name: Negative-control totals
        if: always()
        run: |
          set -o pipefail
          mkdir -p results results-autopilot "$RUNNER_TEMP/gate-summary"
          bash tests/run.sh --tally results results-autopilot | tee "$RUNNER_TEMP/gate-summary/tally.md"
      - name: Every gate job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          rc=0
          for j in gate gate-autopilot gate-client; do
            r="$(jq -r --arg j "$j" '.[$j].result // "missing"' <<<"$NEEDS")"
            echo "$j: $r"
            [ "$r" = success ] || { echo "::error::gate job $j ended with '$r'"; rc=1; }
          done
          exit "$rc"
      - name: Upload the summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-summary-report
          path: ${{ runner.temp }}/gate-summary/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: [plan, gate-summary]
    # Only after the gate passed, and never for a gate-only manual run.
    if: ${{ !cancelled() && needs.plan.outputs.work == 'true' && needs.gate-summary.result == 'success' && !inputs.gate_only }}
    runs-on: ubuntu-latest
    steps:
      # Checked again here, not only in `if:` above: nothing below runs unless the
      # gate passed for this very plan, and a gate-only run never releases.
      - name: Gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE_ONLY: ${{ inputs.gate_only && 'true' || '' }}
        run: |
          if [ -n "$GATE_ONLY" ]; then echo "::error::gate-only run: no tag, no Release"; exit 1; fi
          plan="$(jq -r '.plan.result // "missing"' <<<"$NEEDS")"
          work="$(jq -r '.plan.outputs.work // ""' <<<"$NEEDS")"
          gate="$(jq -r '.["gate-summary"].result // "missing"' <<<"$NEEDS")"
          echo "plan: $plan (work=$work), release gate: $gate"
          if [ "$plan" != success ] || [ "$work" != true ] || [ "$gate" != success ]; then
            echo "::error::release gate did not pass for this plan — no tag, no Release"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scheduled / manual runs cut the tag themselves: exactly the planned tag
      # (PLAN_TAG, named after the week the plan step chose) on the commit the gate
      # tested (RELEASE_SHA), even if main or the date has moved on since. A tag
      # pushed with GITHUB_TOKEN does not trigger another workflow run, so the rest
      # of this job (not a second run) turns it into a Release.
      # "Already tagged" is not "already released": a plan of "page" re-checks that
      # the tag still points at the tested commit and creates the missing page.
      # A failed lookup fails the run rather than guessing either way.
      - name: Cut tag (scheduled / manual)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          PLAN_TAG: ${{ needs.plan.outputs.tag }}
          PLAN_ACTION: ${{ needs.plan.outputs.action }}
        run: |
          page=""
          [ "$PLAN_ACTION" = page ] && page=--page
          set +e
          tag="$(bash scripts/release.sh --cut "$PLAN_TAG" --at "$RELEASE_SHA" $page)"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            released="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
            if grep -qxF -- "$tag" <<<"$released"; then
              echo "$tag 已有 Release 页面，不重复创建"
              exit 0
            fi
            echo "$tag 已有 tag 但还没有 Release 页面，补建"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Read tag from ref
        if: github.event_name == 'push'
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Validate tag format
        if: env.tag != ''
        run: |
          if [[ ! "$tag" =~ ^release/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag $tag doesn't match release/vYYYY.MM.DD.N"
            exit 1
          fi

      - name: Verify tag commit is on main
        if: env.tag != ''
        run: |
          git fetch origin main --quiet
          tag_commit="$(git rev-parse "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::tag $tag points at $tag_commit which is not on main"
            exit 1
          fi

      # The notes start at the nearest earlier tag that has a Release page. A
      # tag whose page was never created is skipped, so its changes land here
      # instead of in no Release at all.
      - name: Generate release notes
        if: env.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          released="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          skip=()
          while :; do
            prev="$(git describe --tags --abbrev=0 --match 'release/v*' "${skip[@]}" "${tag}^" 2>/dev/null || true)"
            [ -n "$prev" ] && ! grep -qxF -- "$prev" <<<"$released" || break
            echo "skipping $prev as the start of the notes: it has no Release page"
            skip+=(--exclude "$prev")
          done
          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
            header="Changes since \`${prev}\`"
          else
            range="${tag}"
            header="Initial release"
          fi
          {
            echo "## ${header}"
            echo ""
            git log "${range}" --no-merges --pretty='- %s (%h)'
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "npx skills add ${GITHUB_REPOSITORY} -g"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        if: env.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag pushed by hand on a commit older than --title falls back to the bare tag.
          title="$(bash scripts/release.sh --title "$tag" || echo "$tag")"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file release-notes.md

  # Any job above failed → open an issue labelled for the daemon, or comment on the open one of the
  # same kind (GitHub#285). Every kind of run, gate-only included; never on a cancelled run. It only
  # creates or comments, never changes an existing issue's labels: scripts/release_failure_report.py.
  # Turned off by the repository variable RELEASE_FAILURE_REPORT=off (docs/operations.md, Release cadence).
  report-failure:
    name: report failure
    needs: [plan, gate, gate-autopilot, gate-client, gate-summary, release]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && vars.RELEASE_FAILURE_REPORT != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that may write issues or read the run's job list; contents: read for the checkout.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gate-summary-report
          path: ${{ runner.temp }}/gate-summary
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gate-client-failures
          path: ${{ runner.temp }}/client-failures
      - name: Open or comment on the release-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          GATE_ONLY: ${{ inputs.gate_only && 'true' || '' }}
          # Must match this repo's dispatch label (LABEL_PENDING_AGENT in the daemon's config).
          DISPATCH_LABEL: ${{ vars.RELEASE_FAILURE_LABEL || 'pending/agent' }}
          SUMMARY_DIR: ${{ runner.temp }}/gate-summary
          CLIENT_DIR: ${{ runner.temp }}/client-failures
        run: python3 scripts/release_failure_report.py
