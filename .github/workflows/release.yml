name: Release

on:
  push:
    tags:
      - 'release/v*'
  # One release per iteration. Iterations run Monday–Sunday, so fire at
  # Monday 00:10 Beijing time (= Sunday 16:10 UTC), right after one ends.
  schedule:
    - cron: '10 16 * * 0'
  workflow_dispatch:
    inputs:
      gate_only:
        description: 'Only run the release gate (every negative control); cut no tag, create no Release'
        type: boolean
        default: false

permissions:
  contents: write

# A scheduled run and a manual one must not both compute "next tag".
concurrency:
  group: release
  cancel-in-progress: false

# Negative controls run only when something is packaged (GitHub#195): for the
# daemon's scripts that is this weekly release. Every negative control in
# tests/*.test.sh runs before a tag is cut, against the one commit the tag will
# point at; any failure means no tag and no Release this run.
#   plan  → which commit, and is there anything to release at all
#   gate / gate-autopilot → MUTATION=1 on every test file (autopilot's ~100
#           broken copies are split over their own jobs, the rest over 4 shards)
#   gate-summary → green only when every shard and every autopilot part passed
#   release → tag exactly the planned commit, notes, Release page
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      work: ${{ steps.decide.outputs.work }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same question the cut step asks, without tagging: a new tag would be cut
      # (exit 0), or the commit is tagged already (exit 3) and only work if its
      # Release page is missing. Anything that ends in a Release page goes
      # through the gate — a hand-pushed tag whose gate failed included.
      # A failed lookup fails the run rather than guessing either way.
      - name: Decide what this run does
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ]; then
            sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
            work=true
          else
            sha="$(git rev-parse HEAD)"
            set +e
            tag="$(bash scripts/release.sh --pending --at "$sha")"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "将发新版 $tag（$sha），先跑发版门禁"
              work=true
            elif [ "$rc" -eq 3 ]; then
              released="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
              if grep -qxF -- "$tag" <<<"$released"; then
                echo "本轮无新提交，不发版（$tag 已发布）"
                work=false
              else
                echo "$tag 已有 tag 但还没有 Release 页面，先跑发版门禁再补建"
                work=true
              fi
            else
              exit "$rc"
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "work=$work" >> "$GITHUB_OUTPUT"

  gate:
    name: gate ${{ matrix.shard }}/4
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      MUTATION: '1'
      # autopilot's negative controls run in gate-autopilot; here the file still
      # runs its scenarios, with no broken copy selected (no name matches).
      AUTOPILOT_MUT_ONLY: none-see-gate-autopilot
      RUN_TEST_TIMEOUT: '5400'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Check origin/main is present
        run: |
          git rev-parse --verify -q origin/main >/dev/null || git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base HEAD origin/main
      - name: Install tmux
        run: |
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V
      - name: Negative controls, shard ${{ matrix.shard }}/4
        run: bash tests/run.sh --ci --shard ${{ matrix.shard }}/4 --out "$RUNNER_TEMP/results"
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 14

  gate-autopilot:
    name: gate autopilot ${{ matrix.part }}/6
    needs: plan
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    env:
      MUTATION: '1'
      AUTOPILOT_MUT_SHARD: ${{ matrix.part }}/6
      RUN_TEST_TIMEOUT: '12600'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - name: Check origin/main is present
        run: |
          git rev-parse --verify -q origin/main >/dev/null || git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base HEAD origin/main
      - name: Install tmux
        run: |
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V
      - name: autopilot negative controls, part ${{ matrix.part }}/6
        run: bash tests/run.sh autopilot --out "$RUNNER_TEMP/results"
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-autopilot-${{ matrix.part }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 14

  # Green only when every expected test file passed exactly once across the four
  # shards and every autopilot part passed: a shard that never ran fails it too.
  gate-summary:
    name: release gate
    needs: [plan, gate, gate-autopilot]
    if: ${{ !cancelled() && needs.plan.outputs.work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gate-results-shard-*
          path: results
      - name: Every negative control passed
        run: |
          rc=0; mkdir -p results
          bash tests/run.sh --ci --verify results || rc=$?
          for r in "${{ needs.gate.result }}" "${{ needs.gate-autopilot.result }}"; do
            if [ "$r" != success ]; then
              echo "::error::gate jobs ended with '$r'"
              rc=1
            fi
          done
          exit "$rc"

  release:
    needs: [plan, gate-summary]
    # Only after the gate passed, and never for a gate-only manual run.
    if: ${{ !cancelled() && needs.plan.outputs.work == 'true' && needs.gate-summary.result == 'success' && !inputs.gate_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scheduled / manual runs cut the tag themselves, on the commit the gate
      # tested (RELEASE_SHA) even if main has moved on since. A tag pushed with
      # GITHUB_TOKEN does not trigger another workflow run, so the rest of
      # this job (not a second run) turns it into a Release.
      # "Already tagged" is not "already released": if the Release step of an
      # earlier run failed after the push, this run creates the missing page.
      # A failed lookup fails the run rather than guessing either way.
      - name: Cut tag (scheduled / manual)
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set +e
          tag="$(bash scripts/release.sh --auto --at "$RELEASE_SHA")"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            released="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
            if grep -qxF -- "$tag" <<<"$released"; then
              echo "本轮无新提交，不发版（$tag 已发布）"
              exit 0
            fi
            echo "$tag 已有 tag 但还没有 Release 页面，补建"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: Read tag from ref
        if: github.event_name == 'push'
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Validate tag format
        if: env.tag != ''
        run: |
          if [[ ! "$tag" =~ ^release/v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag $tag doesn't match release/vYYYY.MM.DD.N"
            exit 1
          fi

      - name: Verify tag commit is on main
        if: env.tag != ''
        run: |
          git fetch origin main --quiet
          tag_commit="$(git rev-parse "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::tag $tag points at $tag_commit which is not on main"
            exit 1
          fi

      # The notes start at the nearest earlier tag that has a Release page. A
      # tag whose page was never created is skipped, so its changes land here
      # instead of in no Release at all.
      - name: Generate release notes
        if: env.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          released="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          skip=()
          while :; do
            prev="$(git describe --tags --abbrev=0 --match 'release/v*' "${skip[@]}" "${tag}^" 2>/dev/null || true)"
            [ -n "$prev" ] && ! grep -qxF -- "$prev" <<<"$released" || break
            echo "skipping $prev as the start of the notes: it has no Release page"
            skip+=(--exclude "$prev")
          done
          if [ -n "$prev" ]; then
            range="${prev}..${tag}"
            header="Changes since \`${prev}\`"
          else
            range="${tag}"
            header="Initial release"
          fi
          {
            echo "## ${header}"
            echo ""
            git log "${range}" --no-merges --pretty='- %s (%h)'
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "npx skills add ${GITHUB_REPOSITORY} -g"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        if: env.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag pushed by hand on a commit older than --title falls back to the bare tag.
          title="$(bash scripts/release.sh --title "$tag" || echo "$tag")"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file release-notes.md
