name: Tests

# Runs tests/*.test.sh on every PR and every push to main (GitHub#117).
# The split, the exclusions and the pass/fail rules all live in tests/run.sh,
# the same entry point you run locally — this file only fans it out.
on:
  # A change that only touches the desktop client (client/**) has its own workflow (client.yml) and
  # none of the shell tests read it, so it does not start this one. The exception is
  # client/test/tauri/mutations.sh, which tests/client-tauri-mutation-prep.test.sh runs.
  # Nothing requires this check by name; if one ever does, a skipped workflow reports nothing and the
  # PR would wait forever: switch to running the workflow and skipping inside it instead.
  pull_request:
    paths:
      - '**'
      - '!client/**'
      - 'client/test/tauri/mutations.sh'
  push:
    branches: [main]
    paths:
      - '**'
      - '!client/**'
      - 'client/test/tauri/mutations.sh'
  # No negative controls here, manual runs included: they run only in negative-controls.yml
  # (GitHub#416).
  workflow_dispatch:

# Fork PRs run with this read-only token and no secrets.
permissions:
  contents: read

# A newer push to the same PR / branch cancels the run it supersedes.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 8 shards (GitHub#495): with 4, the slowest shard took ~17 minutes while the others idled.
        # The count is read from this line by tests/run.test.sh; --verify below needs no number.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Per-file limit.
      RUN_TEST_TIMEOUT: '900'
      # On a pull request: compare with the base branch, so a docs / test-file-only change runs only
      # what it can reach (tests/run.sh, "Changed-file selection"). Pushes to main and manual runs
      # leave it empty and run everything. The summary job computes the same selection again.
      CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      # Full history + origin/main: design-review-gate, requester-bot and
      # repair-unit-links compare against the merge-base with main. A shallow
      # clone has none, and they would quietly fall back to comparing with
      # HEAD~1 / HEAD instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check origin/main is present
        run: |
          git rev-parse --verify -q origin/main >/dev/null || git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base HEAD origin/main
          if [ -n "$CHANGED_FROM" ]; then git rev-parse --verify -q "$CHANGED_FROM" >/dev/null \
              || git fetch --no-tags origin "${CHANGED_FROM#origin/}:refs/remotes/$CHANGED_FROM" || true; fi

      # Everything else (git, jq, python3, node, flock, systemctl, timeout) is on
      # the runner image already.
      - name: Install tmux
        run: |
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V

      - name: Run shard ${{ matrix.shard }}/8
        # Results go outside the checkout: some tests scan the whole repo tree
        # (requester-bot greps it for retired wording) and would read their own logs.
        # -j 3: hosted runners have 4 vCPUs; three units at a time per shard (GitHub#211 used 2; GitHub#495
        # measured both on 8 shards and picked the one with less runner time — the runners are shared and
        # often all busy, so time per job is what the other PRs wait on).
        # tests/run.test.sh reads this command and runs it as written: keep it on one line.
        run: bash tests/run.sh --ci --shard ${{ matrix.shard }}/8 -j 3 --out "$RUNNER_TEMP/results" ${CHANGED_FROM:+--changed-from "$CHANGED_FROM"}

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 14

  # The one check to require for merging: green only when every expected test
  # passed exactly once across the shards — a shard that never ran, or a file
  # no shard picked up, turns it red too.
  summary:
    name: 测试
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      # Full history: with CHANGED_FROM set, --verify recomputes the selection from the same merge-base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Missing artifacts (a shard that never started) must not stop the check
      # below: it is the step that reports which tests have no result.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-results-shard-*
          path: results

      - name: Every expected test passed exactly once
        run: |
          rc=0; mkdir -p results
          bash tests/run.sh --ci --verify results ${CHANGED_FROM:+--changed-from "$CHANGED_FROM"} || rc=$?
          if [ "${{ needs.shard.result }}" != success ]; then
            echo "::error::shard jobs ended with '${{ needs.shard.result }}'"
            rc=1
          fi
          exit "$rc"
