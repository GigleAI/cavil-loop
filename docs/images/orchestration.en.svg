<rect width="270" height="104" rx="10" fill="#FFFDF8" stroke="#CFC7B8"/>
<text x="14" y="32" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="24" font-weight="400" fill="#C2412D" text-anchor="start">①</text>
