<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img">
<title>Where a project plugs in its own commands and prompts</title>
<rect width="1280" height="640" fill="#F6F2EA"/>
<text x="40" y="70" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="32" font-weight="400" fill="#1F1D1A" text-anchor="start">Where a project plugs in its own commands and prompts</text>
<text x="40" y="104" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="16" font-weight="400" fill="#7A746A" text-anchor="start">Top row: one issue from dispatch to PR. Bottom row: after the merge. The red box marks the step explained below.</text>
<text x="40" y="146" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="600" fill="#7A746A" text-anchor="start">Dispatch to PR</text>
<text x="40" y="310" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="600" fill="#7A746A" text-anchor="start">After the merge (every daemon poll)</text>
