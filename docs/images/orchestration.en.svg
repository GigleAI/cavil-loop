<path d="M1099,310 L1105,320 L1111,310" fill="none" stroke="#1F1D1A" stroke-width="2"/>
<text x="1117.0" y="296" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="400" fill="#C2412D" text-anchor="start">merge</text>
<line x1="966" y1="378" x2="942" y2="378" stroke="#1F1D1A" stroke-width="2"/>
<path d="M944,372 L934,378 L944,384" fill="none" stroke="#1F1D1A" stroke-width="2"/>
