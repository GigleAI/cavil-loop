<text x="14" y="60" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#1F1D1A" text-anchor="start">WORKTREE_SETUP_CMD</text>
<rect x="14" y="70" width="123" height="24" rx="12" fill="#DCE6F2"/>
<text x="24" y="87" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" font-weight="400" fill="#2F5D8A" text-anchor="start">run by daemon</text>
</g>
