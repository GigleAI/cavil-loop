<rect width="270" height="104" rx="10" fill="#FFFDF8" stroke="#CFC7B8"/>
<text x="14" y="32" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', serif" font-size="24" font-weight="400" fill="#C2412D" text-anchor="start">②</text>
<text x="46" y="31" font-family="system-ui, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="17" font-weight="600" fill="#1F1D1A" text-anchor="start">Compose prompt</text>
<text x="14" y="60" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="400" fill="#1F1D1A" text-anchor="start">&lt;name&gt;.extra.md</text>
