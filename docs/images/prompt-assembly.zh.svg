<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img">
<title>一条评论怎么变成 worker 手里的指令</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", Helvetica, Arial, sans-serif} text.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect x="0" y="0" width="960" height="526" rx="14" fill="#ffffff"/>
<line x1="304" y1="186.0" x2="344" y2="186.0" stroke="#818b98" stroke-width="2"/>
<polygon points="344,186 334.0,191.0 334.0,181.0" fill="#818b98"/>
<line x1="604" y1="186.0" x2="644" y2="76.0" stroke="#818b98" stroke-width="2"/>
<polygon points="644,76 645.3,87.1 635.9,83.7" fill="#818b98"/>
<line x1="604" y1="186.0" x2="644" y2="186.0" stroke="#818b98" stroke-width="2"/>
<polygon points="644,186 634.0,191.0 634.0,181.0" fill="#818b98"/>
<line x1="604" y1="186.0" x2="644" y2="296.0" stroke="#818b98" stroke-width="2"/>
<polygon points="644,296 635.9,288.3 645.3,284.9" fill="#818b98"/>
<g class="card">
<rect x="30" y="30" width="270" height="312" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="56" cy="58" r="14" fill="#1f2328"/>
<text x="56" y="63" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="80" y="64" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">四层拼装</text>
<rect x="48" y="92" width="234" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="120" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">通用工作流</text>
<rect x="48" y="148" width="234" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="176" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">通用公开经验</text>
<rect x="48" y="204" width="234" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="232" font-size="14" font-weight="normal" fill="#1f2328" text-anchor="start">项目复盘经验</text>
<rect x="48" y="260" width="234" height="44" rx="8" fill="#ddf4ff" stroke="#d0d7de" stroke-width="1"/>
<text x="62" y="288" font-size="14" font-weight="bold" fill="#0550ae" text-anchor="start">项目增量（冲突时为准）</text>
</g>
<g class="card">
<rect x="350" y="140" width="250" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="376" cy="168" r="14" fill="#1f2328"/>
<text x="376" y="173" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="400" y="174" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">合成完整提示词</text>
<text x="370" y="210" font-size="14" font-weight="normal" fill="#59636e" text-anchor="start">再填编号、分支、目录</text>
</g>
<g class="card">
<rect x="650" y="30" width="280" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="676" cy="58" r="14" fill="#1f2328"/>
<text x="676" y="63" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="700" y="64" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">会话还活着</text>
<text x="670" y="100" font-size="14" font-weight="normal" fill="#59636e" text-anchor="start">粘贴进 tmux + 回车</text>
</g>
<g class="card">
<rect x="650" y="140" width="280" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="676" cy="168" r="14" fill="#1f2328"/>
<text x="676" y="173" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="700" y="174" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">会话已退出</text>
<text x="670" y="210" font-size="14" font-weight="normal" fill="#59636e" text-anchor="start">按「编号 + 角色」续上</text>
</g>
<g class="card">
<rect x="650" y="250" width="280" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="676" cy="278" r="14" fill="#1f2328"/>
<text x="676" y="283" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="700" y="284" font-size="17" font-weight="bold" fill="#1f2328" text-anchor="start">第一次派工</text>
<text x="670" y="320" font-size="14" font-weight="normal" fill="#59636e" text-anchor="start">新开一条会话</text>
</g>
<rect x="30" y="382" width="900" height="114" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="914" y="404" font-size="12" font-weight="normal" fill="#59636e" text-anchor="end">说明</text>
<g class="cap" opacity="0">
<animate attributeName="opacity" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.014286;0.185714" values="0;1;0"/>
<text x="54" y="416" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">1. 四层拼装</text>
<text x="54" y="442" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">按顺序叠四层：cavil-loop 自带的通用工作流和通用公开经验，项目自己的复盘经验和增量要求。</text>
<text x="54" y="466" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">冲突时以最后一层「项目增量」为准；项目也可以整份替换第一层。</text>
</g>
<g class="cap" opacity="0">
<animate attributeName="opacity" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.214286;0.385714" values="0;1;0"/>
<text x="54" y="416" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">2. 合成完整提示词</text>
<text x="54" y="442" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">拼成一份完整提示词，再填上编号、分支、工作目录等。</text>
<text x="54" y="466" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">评论原文不拼进来：worker 自己去 GitHub 读，并且只当数据看，不当指令。</text>
</g>
<g class="cap" opacity="0">
<animate attributeName="opacity" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.414286;0.585714" values="0;1;0"/>
<text x="54" y="416" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">3. 会话还活着</text>
<text x="54" y="442" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">worker 的 tmux 会话还在：把提示词粘贴进去再回车，接着原来的上下文干。</text>
<text x="54" y="466" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">复审派工不会粘进写代码的那个会话。</text>
</g>
<g class="cap" opacity="0">
<animate attributeName="opacity" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.614286;0.785714" values="0;1;0"/>
<text x="54" y="416" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">4. 会话已退出</text>
<text x="54" y="442" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">会话退出了但有记录：按「编号 + 角色」续上原来那条对话。</text>
<text x="54" y="466" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">写代码和复审各续各的，互不串台。</text>
</g>
<g class="cap" opacity="0">
<animate attributeName="opacity" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.814286;0.985714" values="0;1;0"/>
<text x="54" y="416" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="start">5. 第一次派工</text>
<text x="54" y="442" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">没有可续的对话（或续上后立刻退出）：新开一条会话，</text>
<text x="54" y="466" font-size="15" font-weight="normal" fill="#1f2328" text-anchor="start">提示词作为启动参数直接传进去。</text>
</g>
<rect class="focus" x="24" y="24" width="282" height="324" rx="14" fill="none" stroke="#cf222e" stroke-width="3.5">
<animate attributeName="x" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000" values="24;344;644;644;644"/>
<animate attributeName="y" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000" values="24;134;24;134;244"/>
<animate attributeName="width" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000" values="282;262;292;292;292"/>
<animate attributeName="height" dur="17.5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000000;0.200000;0.400000;0.600000;0.800000" values="324;104;104;104;104"/>
</rect>
</svg>
