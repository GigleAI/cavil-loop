<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
  html,body{margin:0;width:660px;height:460px;overflow:hidden;background:#f6f8fa;color:#1f2328;
    font:13px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC","Noto Sans SC",sans-serif}
  .arrow{position:absolute;left:265px;top:100px;width:130px;text-align:center;font-size:40px;color:#8c959f}
  .drag{position:absolute;left:0;right:0;top:28px;text-align:center;font-size:15px;font-weight:600}
  .help{position:absolute;left:28px;right:28px;top:212px;bottom:112px;background:#fff;border:1px solid #d1d9e0;border-radius:10px;padding:12px 16px}

  <div class="drag">把 Cavil Loop 拖进「应用程序」</div>
  <div class="arrow">→</div>
  <div class="help">
    <h2>第一次打开被 macOS 拦住？（本 App 没有苹果签名）任选一种放行：</h2>
    <ol>
      <li>打开「系统设置 → 隐私与安全性」，往下找到「仍要打开」，按提示输入密码后打开。</li>
      <li>或在「终端」运行下面这行，再双击 App：<br><code>xattr -dr com.apple.quarantine "/Applications/Cavil Loop.app"</code></li>
    </ol>
    <div class="muted">命令可从下方的「打不开时看这里.txt」复制。每装一个新版本都要放行一次。</div>
  </div>
