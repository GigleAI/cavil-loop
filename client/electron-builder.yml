# macOS packaging (v1: dmg for Apple silicon and Intel, not Apple-signed).
appId: dev.luosky.cavil-loop.client
productName: Cavil Loop
directories:
  output: release
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
asar: true
npmRebuild: false
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
  # No Apple Developer ID in v1: electron-builder does not sign; the
  # afterPack hook gives the bundle an ad-hoc signature instead (Apple
  # silicon needs one). Gatekeeper still asks on first open (RELEASE_NOTES.md).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: Cavil-Loop-${version}-${arch}.${ext}
