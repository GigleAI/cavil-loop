[package]
name = "cavil-harness"
version = "0.5.2"
edition.workspace = true
license.workspace = true
description = "Test-only: the client back end over stdin/stdout, so the TypeScript suites drive the real Rust code"

[dependencies]
cavil-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# the library Tauri's updater plugin checks update signatures with (test.update.verify cross-checks scripts/update-manifest.mjs)
minisign-verify = "0.3"
base64 = "0.23"
