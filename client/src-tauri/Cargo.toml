# The desktop app (Tauri). The back end proper is crates/core; this crate only
# wires it to the window (one IPC command) and to the operating system.
[package]
name = "cavil-loop-client"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Cavil Loop desktop board client"

[[bin]]
name = "cavil-loop-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
cavil-core.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
async-trait.workspace = true
url = "2"
tokio.workspace = true

# The desktop side (GitHub#169): notifications through the system's current
# notification API, launch at login, keeping a hidden window's process awake.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSBundle", "NSProcessInfo", "NSDictionary", "NSSet", "NSObject", "NSThread"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotification", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNNotificationSound"] }

[workspace]
members = [".", "crates/core", "crates/harness"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
cavil-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process"] }
async-trait = "0.1"

# Small binary: the download size is the reason this shell exists (GitHub#151).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
